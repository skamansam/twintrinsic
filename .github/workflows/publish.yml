name: Publish to npm and Create Release

# Per the E2E → Storybook migration plan § 9.4 A tag push only publishes
# when the same SHA has cleared the `test` job defined in this file
# (which mirrors `.github/workflows/test.yml`). Locally, the equivalent
# gate is `pnpm test:all`.

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Pre-publish test sweep
    # Mirror the parallel jobs in .github/workflows/test.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm check:lib
      - run: pnpm check:a11y
      - run: pnpm validate:exports
      - run: pnpm test:unit

  publish:
    name: Publish to npm and create GitHub release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run prepack

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub npm
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Published to npm as \`@skamansam/twintrinsic@${{ github.ref_name }}\`

            Install with:
            \`\`\`bash
            npm install @skamansam/twintrinsic@${{ github.ref_name }}
            \`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
