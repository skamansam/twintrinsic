name: Tests

# Runs the full test matrix on every push to main and on every pull request.
# Per docs/plans/E2E_TO_STORYBOOK_MIGRATION_PLAN.md § 9.4:
#   - `unit` — vitest --project=unit (jsdom)
#   - `build-and-typecheck` — svelte-check, pnpm check:lib, pnpm check:a11y
#   - `storybook` — vitest --project=storybook (browser-mode Playwright + axe)
#   - `e2e` — Playwright against the SvelteKit preview on port 5173

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build-and-typecheck:
    name: Build, type-check, and a11y budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:lib
      - run: pnpm check:a11y
      - run: pnpm check:i18n
      - run: pnpm check:assets
      - run: pnpm check:placeholders
      - run: pnpm validate:exports
      - run: pnpm build:lib

  storybook:
    # vitest --project=storybook runs in browser mode against a real
    # Chromium binary. The @storybook/addon-a11y addon runs axe-core
    # against every story at the same time.
    name: Storybook interaction + a11y tests (Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:storybook

  e2e:
    # Playwright against the SvelteKit preview booted on port 5173.
    name: E2E docs-site smokes (Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      # Debugging artifacts (screenshot/video/trace per failed test — see
      # playwright.config.ts `use`). Uploaded only when the job fails;
      # `test-results/` is gitignored, and `if-no-files-found: ignore` keeps
      # green runs artifact-free.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser-compat:
    # Cross-browser feature-detection probe (Part 1.5 of
    # docs/plans/HTML_SEMANTIC_REPLACEMENT_PLAN.md). Records which Tier 0
    # platform APIs are supported in Chromium, Firefox, and WebKit, and
    # merges the results into static/browser-compat.json for the docs
    # site's CompatibilityMatrix component. Uploaded as an artifact rather
    # than committed automatically — update static/browser-compat.json
    # from the artifact when you want the docs site to pick up new data.
    name: Browser compatibility matrix (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compat
      - run: pnpm test:compat:merge
      - uses: actions/upload-artifact@v4
        with:
          name: browser-compat
          path: static/browser-compat.json
